[project]
name = "ragkit-observe"
version = "0.1.0"
description = "OpenTelemetry tracing setup for ragkit: Langfuse, Phoenix, any OTLP backend."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[tool.uv.sources]
ragkit-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
