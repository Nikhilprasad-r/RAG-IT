[project]
name = "ragkit-ingest"
version = "0.1.0"
description = "Connectors, parsers, chunking and the incremental ingestion pipeline for ragkit."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "ragkit-retrieval",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]

[tool.uv.sources]
ragkit-core = { workspace = true }
ragkit-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
