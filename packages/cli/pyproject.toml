[project]
name = "ragkit-cli"
version = "0.1.0"
description = "The ragkit command line: init projects, ingest, search, add agent templates, chat and serve."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "ragkit-retrieval",
    "ragkit-ingest",
    "ragkit-agents",
    "ragkit-observe",
    "ragkit-evals",
    "ragkit-server",
    "typer>=0.20",
    "rich>=13.0",
]

[project.scripts]
ragkit = "ragkit.cli.main:app"

[tool.uv.sources]
ragkit-core = { workspace = true }
ragkit-retrieval = { workspace = true }
ragkit-ingest = { workspace = true }
ragkit-agents = { workspace = true }
ragkit-observe = { workspace = true }
ragkit-evals = { workspace = true }
ragkit-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
