[project]
name = "ragkit-agents"
version = "0.1.0"
description = "Agent runtime, manifests and copy-in agent templates for ragkit."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "ragkit-retrieval",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langgraph>=1.2",
    "langchain-mcp-adapters>=0.2",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.4"]
openai = ["langchain-openai>=1.7"]
anthropic = ["langchain-anthropic>=1.0"]
sql = ["sqlalchemy>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary,pool]>=3.2"]

[tool.uv.sources]
ragkit-core = { workspace = true }
ragkit-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
