[project]
name = "ragkit-retrieval"
version = "0.1.0"
description = "Embedders, vector + keyword stores, hybrid search and rerankers for ragkit."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "numpy>=2.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.4"]
openai = ["langchain-openai>=1.7"]
postgres = ["psycopg[binary,pool]>=3.2"]
local-rerank = ["sentence-transformers>=4.0"]

[tool.uv.sources]
ragkit-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
