[project]
name = "ragkit-evals"
version = "0.1.0"
description = "Agent and search evaluation for ragkit, with CI gates."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "ragkit-retrieval",
    "ragkit-agents",
    "langchain>=1.4",
]

[tool.uv.sources]
ragkit-core = { workspace = true }
ragkit-retrieval = { workspace = true }
ragkit-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
