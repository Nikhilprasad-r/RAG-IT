[project]
name = "ragkit-server"
version = "0.1.0"
description = "FastAPI gateway that serves ragkit agents."
requires-python = ">=3.12"
dependencies = [
    "ragkit-core",
    "ragkit-retrieval",
    "ragkit-ingest",
    "ragkit-agents",
    "ragkit-observe",
    "fastapi>=0.160",
    "uvicorn[standard]>=0.50",
    "pyjwt[crypto]>=2.9",
]

[tool.uv.sources]
ragkit-core = { workspace = true }
ragkit-retrieval = { workspace = true }
ragkit-ingest = { workspace = true }
ragkit-agents = { workspace = true }
ragkit-observe = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
