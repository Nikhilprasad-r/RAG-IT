{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ragkit.serviceAccountName" . }}
  labels:
    {{- include "ragkit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.projectConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragkit.fullname" . }}-config
  labels:
    {{- include "ragkit.labels" . | nindent 4 }}
data:
  ragkit.yaml: |
    {{- .Values.projectConfig | nindent 4 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ragkit.fullname" . }}
  labels:
    {{- include "ragkit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "ragkit.fullname" $ }}-api
                port: {name: http}
          {{- end }}
    {{- end }}
{{- end }}
